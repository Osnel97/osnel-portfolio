<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#140e0a" />
    <meta name="description" content="Osnel Hosea — App Security & Full-Stack Developer. Portfolio of security-first software engineering, DevSecOps, and full-stack development work." />

    <!-- Security headers achievable via <meta> on static hosting (GitHub Pages
         serves no custom HTTP headers, so anything header-only — X-Frame-Options,
         X-Content-Type-Options, Permissions-Policy, HSTS — can't be set here;
         see SECURITY.md for how those are covered). -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data:;
      font-src 'self';
      connect-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    " />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Osnel Hosea · Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
